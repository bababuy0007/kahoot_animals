<!DOCTYPE html>
<html lang="uk">
    <head>
        <link rel="stylesheet" href="style.css" />
    </head>
  <body>
    <div class="app-container">
      <div id="start-screen" class="screen">

        <h1 class="start-screen__title">Тваринний штурм </h1>         
        <h2 class="start-screen__description">Покажи хто тут зоолог😏 </h2>
        <button class="start-button" id="start-btn">Почати</button>
      </div>
       <img src="pngegg.png" width="100px"height="110px" />
      <div id="quiz-screen" class="screen hide">
        <div class="header">
          <span id="timer">Час: 15</span>
        </div>

        <h2 id="question-text">Запитання number 1</h2>

        <div id="answers-container"></div>
      </div>

      <!--njhjbjk-->
      <div id="result-screen" class="screen hide">
        <h2>Квіз завершено</h2>
        <p id="result-text"></p>
        <button id="restart-btn">Спробувати ще</button>
      </div>
      
    </div>
    <script src="script.js"></script>
  </body>
</html>
